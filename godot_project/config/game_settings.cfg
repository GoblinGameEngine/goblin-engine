; Human-editable game settings. Edit and restart the game to apply.

[daynight]

; How many real-world seconds pass for one in-game hour.
; Default: 60 -> 1 in-game hour per real minute -> a full 24h day takes 24 real minutes.
seconds_per_game_hour=60.0

; Hour (0-24, fractional allowed) the game starts at.
start_hour=9.0

[combat]

; Disposition threshold at/below which two factions are considered hostile to each other.
hostile_threshold=-20

; Disposition threshold at/above which two factions are considered allied (won't be provoked as easily).
ally_threshold=40
